<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>VICKY AI</title></head><body style="background:#111;color:#fff;font-family:sans-serif"><div style="max-width:700px;margin:auto;padding:15px"><h2>VICKY AI LIVE</h2><div id=chat></div><input id=q style="width:70%;padding:10px" placeholder="Sawal likho..."><button onclick="send()" style="padding:10px">Send</button></div><script>let h=[];async function send(){let v=q.value;if(!v)return;h.push({role:'user',content:v});chat.innerHTML+=`<p><b>You:</b> ${v}</p>`;q.value='';let r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:h})});let d=await r.json();h.push({role:'assistant',content:d.reply});chat.innerHTML+=`<p style=color:#0f8><b>VICKY:</b> ${d.reply}</p>`;}</script></body></html>
